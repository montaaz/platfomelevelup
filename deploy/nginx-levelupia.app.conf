# /etc/nginx/sites-available/levelupia.app
# Level Up IA — proxy vers l'application Next.js (PM2, port 3000)

# ---------- HTTP : redirige tout vers HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name levelupia.app www.levelupia.app;

    return 301 https://$host$request_uri;
}

# ---------- HTTPS : le vrai service ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name levelupia.app www.levelupia.app;

    # Certificat d'origine Cloudflare (valable 15 ans)
    ssl_certificate     /etc/ssl/cloudflare/levelupia.app.pem;
    ssl_certificate_key /etc/ssl/cloudflare/levelupia.app.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # livrables jusqu'à 100 Mo côté application
    client_max_body_size 110M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # indispensables : sans eux les redirections repartent vers localhost
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }
}
